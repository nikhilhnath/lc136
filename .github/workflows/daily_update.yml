name: Midnight Dashboard Updater

# Triggers the robot at 18:29 UTC (which is exactly 11:59 PM IST)
on:
  schedule:
    - cron: '29 18 * * *'
  workflow_dispatch: # Allows manual trigger button

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pytz

      - name: Run Update Script
        run: python update_stats.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Civic Tracker Bot"
          git add index.html memory.json
          git commit -m "Automated 11:59 PM Data Update" || exit 0
          git push
```
