name: Midnight Dashboard Updater

on:
  schedule:
    - cron: '29 18 * * *'
  workflow_dispatch: 

# THIS GIVES THE ROBOT PERMISSION TO SAVE FILES (Fixes Exit Code 128)
permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      # Upgraded to v4 (Fixes Node.js warning)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Upgraded to v5 (Fixes Node.js warning)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pytz

      - name: Run Update Script
        run: python update_stats.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Civic Tracker Bot"
          git add index.html memory.json
          git commit -m "Automated Data Update" || exit 0
          git push
